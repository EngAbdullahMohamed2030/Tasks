<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="shortcut icon" href="./images/NNR.jpg">
    <link rel="stylesheet" href="./Bootstrap/css/bootstrap.min.css">
</head>
<body>
    <section class="w-100 pt-5" style="background-color: #f4f4f4; min-height:100vh">
        <div class="container bg-white rounded-4 p-3 shadow-sm " style="max-width: 1100px;">
            <h1 class="text-center fw-bold">Tasks Management System</h1>
            <div class="Add d-flex gap-3 mb-4">
                <input type="text" id="taskName" class="form-control fs-6 form-control-lg" placeholder="Enter a task Name">
                <input type="text" id="taskDesc" class="form-control fs-6 form-control-lg" placeholder="Enter a task Description">
                <input type="text" id="taskStatus" class="form-control fs-6 form-control-lg" placeholder="Enter a task Status">
                <button id="add" class="btn btn-primary text-nowrap">+ Add Task</button>
            </div>
            <table class="table text-center align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="taskList">
                    <tr>
                        <td>1</td>
                        <td>Task 1</td>
                        <td>Go to GYM</td>
                        <td><button class="btn btn-success">Done</button></td>
                        <td>
                            <button class="btn btn-primary">Update</button>
                            <button class="btn btn-secondary">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="update w-100 h-100 top-0 start-0 position-fixed justify-content-center align-items-center " style="background-color:rgba(0, 0, 0, 0.6);">
            <form style="max-width: 400px;" class="bg-white rounded-4 shadow p-4 d-flex flex-column gap-3 w-100">
                <div class="d-flex justify-content-between align-items-center">
                    <h4 class="fw-bold mb-0">Update Task</h4>
                    <button id="close" type="button" class="btn-close" aria-label="Close"></button>
                </div>
                <div>
                    <label for="nameUpdate" class="form-label fw-semibold">Task Name</label>
                    <input type="text" id="nameUpdate" class="form-control fs-6 form-control-lg" placeholder="Enter a task Name">
                </div>
                <div>
                    <label for="descUpdate" class="form-label fw-semibold">Description</label>
                    <input type="text" id="descUpdate" class="form-control fs-6 form-control-lg" placeholder="Enter a task Description">
                </div>
                <div>
                    <label for="statusUpdate" class="form-label fw-semibold">Status</label>
                    <input type="text" id="statusUpdate" class="form-control fs-6 form-control-lg" placeholder="Enter a task Status">
                </div>
                <div class="d-flex gap-2 justify-content-end">
                    <button id="cancel" type="button" class="btn btn-secondary">Cancel</button>
                    <button id="update" type="button" class="btn btn-primary text-nowrap">Update</button>
                </div>
            </form>
        </div>
    </section>
    <script src="./Js/script.js"></script>
</body>
</html>
